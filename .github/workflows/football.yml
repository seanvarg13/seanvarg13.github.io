# The football site's update (seanvarg13.github.io/football/): rebuilds every season's files from nflverse with
# tools/fb/build_fb.py and publishes football/ as a plain commit on top of main (never a force-push), the same way the
# baseball site's daily run does. nflverse refreshes play-by-play overnight after each game day, so this runs on
# Monday, Tuesday and Friday mornings (after Sunday, Monday night and Thursday night games) from September to
# mid-February, and by hand any time (Actions -> Football update -> Run workflow).
name: Football update

on:
  schedule:
    - cron: "20 11 * * 1,2,5"
  workflow_dispatch:
    inputs:
      staff:
        description: "refresh the coordinators from Wikipedia for these seasons (e.g. 2026); blank keeps staff.json"
        default: ""
      dry:
        description: "build but don't publish"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: football-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: In season?
        id: gate
        run: |
          go=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            m=$(date -u +%m); d=$(date -u +%d)
            # September through mid-February (the Super Bowl); a manual run always builds
            if [ "$m" -ge 3 ] && [ "$m" -le 8 ]; then go=false; fi
            if [ "$m" = "02" ] && [ "$d" -gt 20 ]; then go=false; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.11"

      - name: Packages
        if: steps.gate.outputs.go == 'true'
        run: python -m pip install pandas pyarrow scikit-learn

      - name: Restore the download cache
        if: steps.gate.outputs.go == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .cache/fb
          key: fb-cache-${{ github.run_id }}
          restore-keys: fb-cache-

      - name: Coordinators
        if: steps.gate.outputs.go == 'true' && inputs.staff != ''
        run: python tools/fb/build_staff.py --out football/data/staff.json --refresh "${{ inputs.staff }}"

      - name: Build
        if: steps.gate.outputs.go == 'true'
        run: |
          season=$(python -c "import datetime as d; t=d.date.today(); print(t.year if t.month >= 8 else t.year - 1)")
          python tools/fb/build_fb.py --cache .cache/fb --out football/data --seasons 2016-$season --current $season

      - name: Publish
        if: steps.gate.outputs.go == 'true' && inputs.dry != true
        run: |
          git config user.name "Sean's Site (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/fb/publish_fb.py --push

      - name: Save the download cache
        if: always() && steps.gate.outputs.go == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/fb
          key: fb-cache-${{ github.run_id }}
