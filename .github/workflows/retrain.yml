# Retrain the directional xwOBA / xBA / xSLG models (tools/models/model3.py, model_bs.py) on GitHub's machines, then
# put them on the "models" release the daily build reads — the job that used to need Sean's Mac.
#
# Actions -> Retrain models -> Run workflow. It fetches every regular-season PA 2015-now from Statcast
# (tools/models/fetch_pa.py, ~25 min), trains with the exact Python + package versions in the release's versions.json
# (so the daily build can load the files), saves the models it replaces on a "models-prev-<date>" release, uploads the
# new ones, and — unless told not to — rescores every past MLB season and postseason with them and rebuilds this season,
# publishing as the daily run does.
#
# restore: a models-prev-<date> tag puts those models back instead of training (Sean, 30 Sep 2026: the "harder is never worse"
# fit tracked actual wOBA worse — same season r .818 vs .854 — so the previous models went back). The ones it replaces are
# kept on a new models-prev release as usual, then the same rescore runs.
name: Retrain models

on:
  workflow_dispatch:
    inputs:
      monotonic:
        description: "harder is never worse: the prediction may only rise with exit velocity"
        type: boolean
        default: false
      publish:
        description: "upload the new models (off = train and report only)"
        type: boolean
        default: true
      rescore:
        description: "after uploading, rescore every past MLB season (and past postseasons) with them"
        type: boolean
        default: true
      restore:
        description: "instead of training, put back the models on this release (e.g. models-prev-20260930-1634)"
        default: ""

permissions:
  contents: write
  pages: write

# its own queue (30 Sep 2026): in the daily one a scheduled backup run, arriving while this waited, cancelled it — GitHub
# keeps one waiting run per group. Publishing is safe alongside a daily run: cloud_daily.py commits on top of main as it is
# and retries when main has moved.
concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MODEL_DIR: ${{ github.workspace }}/../model-workspace
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: The current models and the versions they were saved with
        id: models
        run: |
          mkdir -p "$MODEL_DIR/prev"
          gh release download models -R "$GITHUB_REPOSITORY" -D "$MODEL_DIR/prev" --clobber
          ls -la "$MODEL_DIR/prev"
          echo "python=$(python3 -c "import json; print(json.load(open('$MODEL_DIR/prev/versions.json'))['python'])")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.models.outputs.python }}

      - name: Packages (the same pins, so the daily build can load what this saves)
        run: |
          python -m pip install --upgrade pip
          pins=$(python -c "import json; v=json.load(open('$MODEL_DIR/prev/versions.json')); print(' '.join(f'{k}=={x}' for k, x in v['packages'].items()))")
          echo "pins: $pins"
          python -m pip install $pins pybaseball requests pyarrow

      - name: Put back the models on ${{ inputs.restore }} (no training)
        if: inputs.restore != ''
        run: |
          gh release download "${{ inputs.restore }}" -R "$GITHUB_REPOSITORY" -D "$MODEL_DIR" --clobber
          for m in v3_dir v3_ba v3_slg; do test -s "$MODEL_DIR/$m.joblib" || { echo "::error::$m.joblib is missing from ${{ inputs.restore }}"; exit 1; }; done
          cat "$MODEL_DIR/versions.json"
          ls -la "$MODEL_DIR"

      - name: Past seasons' PA files (only the current season is fetched every time)
        if: inputs.restore == ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/../model-workspace/pa_20*.parquet
          key: pa-seasons-${{ github.run_id }}
          restore-keys: pa-seasons-

      - name: Every regular-season plate appearance 2015-now
        if: inputs.restore == ''
        run: python tools/models/fetch_pa.py

      - name: Keep the past seasons' PA files for next time (even after a failure, so a rerun picks up where this stopped)
        if: always() && inputs.restore == ''
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/../model-workspace/pa_20*.parquet
          key: pa-seasons-${{ github.run_id }}

      - name: Train
        if: inputs.restore == ''
        run: |
          export ANCHOR=$(python -c "import pandas as pd; print(int(pd.read_parquet('$MODEL_DIR/pa_all.parquet', columns=['game_year']).game_year.max()))")
          export MONO=${{ inputs.monotonic && '1' || '0' }}
          echo "anchor $ANCHOR · monotonic $MONO"
          python tools/models/model3.py
          python tools/models/model_bs.py
          python - <<'PY'
          import json, os, platform, datetime as dt, importlib.metadata as md
          d = os.environ["MODEL_DIR"]
          v = {"python": ".".join(platform.python_version_tuple()[:2]),
               "packages": {p: md.version(p) for p in ("scikit-learn", "numpy", "pandas", "scipy", "joblib")},
               # the Mac's publisher leaves models alone that are newer on the release than its own (publish_github.py)
               "trained": {"by": "github-actions", "at": dt.datetime.now(dt.timezone.utc).strftime("%Y-%m-%d %H:%M"),
                           "through": int(os.environ["ANCHOR"]), "monotonic": os.environ["MONO"] == "1"}}
          json.dump(v, open(os.path.join(d, "versions.json"), "w"), indent=1, sort_keys=True)
          print(json.dumps(v, indent=1))
          PY
          ls -la "$MODEL_DIR"

      - name: Keep the old models, upload the new ones
        if: inputs.publish
        run: |
          tag="models-prev-$(date -u +%Y%m%d-%H%M)"
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "Models replaced $(date -u +%F)" \
            --notes "The directional models the retrain of $(date -u '+%F %H:%M') UTC replaced. To go back, upload these to the models release." \
            "$MODEL_DIR"/prev/v3_dir.joblib "$MODEL_DIR"/prev/v3_ba.joblib "$MODEL_DIR"/prev/v3_slg.joblib "$MODEL_DIR"/prev/versions.json
          gh release upload models -R "$GITHUB_REPOSITORY" --clobber \
            "$MODEL_DIR"/v3_dir.joblib "$MODEL_DIR"/v3_ba.joblib "$MODEL_DIR"/v3_slg.joblib "$MODEL_DIR"/versions.json

      - name: The daily build's download caches (for the rescore)
        if: inputs.publish && inputs.rescore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.pybaseball/cache
            .cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-

      - name: Rescore every past season, then this one, with the new models
        if: inputs.publish && inputs.rescore
        run: |
          # right here rather than as a Daily update run: one queued there can be cancelled by the next scheduled backup
          git config user.name "Sean's Site (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # this season from data.js (a restore has no PA file to read it from)
          years=$(python -c "import json; raw=open('data.js').read(); y=int(json.loads(raw[raw.index('= {') + 2:].rstrip().rstrip(';'))['meta']['season']); print(' '.join([str(x) for x in range(2015, y)] + [f'post-{x}' for x in range(2023, y)]))")
          echo "rescoring $years"
          python tools/cloud_daily.py --rescore $years
          python tools/cloud_daily.py --steps mlb
