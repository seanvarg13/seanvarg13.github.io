# The daily update, on GitHub's machines instead of Sean's Mac: every morning at 4:45 New York time, whether or not
# the Mac is on. tools/cloud_daily.py does the work (the same build scripts the Mac runs, from tools/).
#
# Two crons because GitHub's schedule is in UTC and New York moves an hour twice a year: 8:45 UTC is 4:45 in summer
# (EDT), 9:45 UTC is 4:45 in winter (EST). The first step lets only the right one through. GitHub can start a
# scheduled run a few minutes late at busy times; the MLB publish lands ~25 minutes after it starts.
#
# tools/cloud.json {"daily": true} is the switch: while it is false the schedule does nothing (the Mac still
# publishes) and only a manual run (Actions -> Daily update -> Run workflow) builds.
name: Daily update

on:
  schedule:
    - cron: "45 8 * * *"
    - cron: "45 9 * * *"
    - cron: "17 10 * * *"
    - cron: "47 11 * * *"
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      steps:
        description: "auto = only what has new games since its last build; or mlb, minors, post, spring (comma-separated) to rebuild those whatever is new"
        default: "auto"
      rescore:
        description: "rebuild past seasons instead (e.g. 2015 2016 … 2025); blank for the daily run"
        default: ""
      auto:
        description: "set by the outside timer (cron-job.org): only build if today's update isn't live yet, like a scheduled run"
        default: ""
      dry:
        description: "build but don't publish"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Is it 4:45 in New York, and is the cloud switched on?
        id: gate
        run: |
          go=true
          # a manual run left at steps=auto (the default since 20 Oct 2026 — the 4:50 routine starts one with no inputs) still
          # asks whether anything is new (tools/whats_new.py), but at any hour; one that names its steps or a rescore just builds
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ github.event.inputs.auto }}" != "1" ] && [ -z "${{ github.event.inputs.rescore }}" ] && [ "${{ github.event.inputs.steps }}" = "auto" ]; then
            go=$(python3 - <<'PY'
          import datetime as dt, sys, zoneinfo
          sys.path.insert(0, "tools")
          import whats_new
          ny = dt.datetime.now(zoneinfo.ZoneInfo("America/New_York"))
          try:
              res = whats_new.check((ny.date() - dt.timedelta(days=1)).isoformat())
              print("  " + whats_new.describe(res), file=sys.stderr)
              print("true" if whats_new.steps(res) else "false")
          except Exception as e:
              print(f"  MLB's schedule didn't answer ({type(e).__name__}: {e}) — building", file=sys.stderr)
              print("true")
          PY
            )
            echo "manual run, steps=auto → go=$go"
          fi
          # the outside timer (cron-job.org, 28 Sep 2026 — GitHub's own schedule kept starting hours late or not at all)
          # starts a manual run with auto=1, which asks the same questions as a scheduled one
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.auto }}" = "1" ]; then
            # GitHub starts scheduled runs late when it's busy — hours late, some mornings (25 Sep 2026: the 4:45 run
            # began at 10:10). So there are backup times above, and every scheduled run just asks: is it past 4:45 in
            # New York, and is today's update not live yet? The first one that finds it missing does it; the rest stand down.
            if ! python3 -c "import json,sys; sys.exit(0 if json.load(open('tools/cloud.json')).get('daily') else 1)"; then
              echo "tools/cloud.json has the cloud off — the Mac publishes"; go=false
            else
              go=$(AUTO="${{ github.event.inputs.auto }}" python3 - <<'PY'
          import datetime as dt, os, sys, zoneinfo
          sys.path.insert(0, "tools")
          import whats_new
          ny = dt.datetime.now(zoneinfo.ZoneInfo("America/New_York"))
          yday = (ny.date() - dt.timedelta(days=1)).isoformat()
          now_utc = dt.datetime.now(dt.timezone.utc)
          # the outside timer has fired at 08:15 UTC since it went live (4:15 here in summer, 3:15 in winter) and stood down as
          # "early" every morning until 20 Oct 2026; its start counts from 3:00 (every night game is final and on Savant by then).
          # The scheduled runs keep 4:40, which is what lets only the right one of the 8:45 / 9:45 UTC pair through
          early = (ny.hour, ny.minute) < ((3, 0) if os.environ.get("AUTO") == "1" else (4, 40))
          # the off-season (Sean, 1 Oct 2026): nothing to build from 15 Nov (the World Series is over) to 14 Feb (spring training's
          # first games are later in the month); a manual run without auto still builds
          if (ny.month, ny.day) >= (11, 15) or (ny.month, ny.day) < (2, 15):
              early = True
          go = not early
          if go:
              # is there anything new? (Sean, 20 Oct 2026: through the postseason every morning rebuilt the regular season and the
              # minors, twice some days, with no new game in either, and each publish reloads his phone.) tools/whats_new.py checks
              # MLB's schedule for a game final since each file's last game day: data.js, the postseason, spring training, each
              # minor-league level. Nothing new means no build; the build step then runs only the steps that have something
              try:
                  res = whats_new.check(yday)
                  print("  " + whats_new.describe(res), file=sys.stderr)
                  go = bool(whats_new.steps(res))
                  # a file built after 13:00 UTC today counts as done, so a game Savant hasn't posted can't keep the backups
                  # rebuilding all day
                  b = whats_new.last_built()
                  if go and b[:10] == now_utc.date().isoformat() and b[11:13] >= "13":
                      print(f"  already built today at {b[11:]} UTC — the backups stand down", file=sys.stderr)
                      go = False
              except Exception as e:                       # MLB's schedule didn't answer: build, as before
                  print(f"  MLB's schedule didn't answer ({type(e).__name__}: {e}) — building", file=sys.stderr)
          print("true" if go else "false")
          PY
              )
              echo "New York $(TZ=America/New_York date '+%H:%M') · data through $(grep -o '"through": *"[^"]*"' data.js | head -1) → go=$go"
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

      - name: Models and the versions they were saved with (from the "models" release)
        if: steps.gate.outputs.go == 'true'
        id: models
        run: |
          mkdir -p ../model-workspace
          gh release download models -R "$GITHUB_REPOSITORY" -D ../model-workspace --clobber
          ls -la ../model-workspace
          for m in v3_dir v3_ba v3_slg; do test -s ../model-workspace/$m.joblib || { echo "::error::$m.joblib is missing from the models release"; exit 1; }; done
          # the fixed Stuff+ models (3 Oct 2026): without the file the build trains them itself, as it used to
          test -s ../model-workspace/stuff_models.joblib && echo "stuff_models.joblib: $(stat -c %s ../model-workspace/stuff_models.joblib) bytes" || echo "::warning::no stuff_models.joblib on the models release — Stuff+ will be trained in the build"
          py=$(python3 -c "import json; print(json.load(open('../model-workspace/versions.json'))['python'])")
          echo "python=$py" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: ${{ steps.models.outputs.python }}

      - name: Packages (pinned to what the models were pickled with)
        if: steps.gate.outputs.go == 'true'
        run: |
          python -m pip install --upgrade pip
          pins=$(python -c "import json; v=json.load(open('../model-workspace/versions.json')); print(' '.join(f'{k}=={x}' for k, x in v['packages'].items()))")
          echo "pins: $pins"
          python -m pip install $pins pybaseball requests pyarrow

      - name: Headless Chrome (home's lists, hist/home.js)
        if: steps.gate.outputs.go == 'true'
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright-core@1.56.1
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          echo "PW_CHANNEL=chrome" >> "$GITHUB_ENV"

      - name: Restore the download caches
        if: steps.gate.outputs.go == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.pybaseball/cache
            .cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-

      - name: Build and publish
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "Sean's Site (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=""
          if [ -n "${{ inputs.rescore }}" ]; then args="--rescore ${{ inputs.rescore }}";
          # a scheduled run and the outside timer's (auto=1) build only what has new games since its last build (tools/whats_new.py)
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.auto }}" = "1" ]; then args="--steps auto";
          elif [ -n "${{ inputs.steps }}" ]; then args="--steps ${{ inputs.steps }}"; fi
          [ "${{ inputs.dry }}" = "true" ] && args="$args --dry"
          python tools/cloud_daily.py $args

      - name: Save the download caches (even after a failure, so tomorrow starts warm)
        if: always() && steps.gate.outputs.go == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.pybaseball/cache
            .cache
          key: data-cache-${{ github.run_id }}
